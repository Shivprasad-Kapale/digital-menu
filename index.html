<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Veg and non-veg meals, snacks, biryani, and thalis from Jadhav Dhaba. जाधव धाब्याचे व्हेज आणि नॉन व्हेज पदार्थ."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Jadhav Dhaba | जाधव धाबा</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="menu-app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="#" aria-label="Jadhav Dhaba home">
          <span class="brand-mark" aria-hidden="true">JD</span>
          <span class="brand-name"><span>Jadhav <strong>Dhaba</strong></span><span class="brand-marathi">जाधव धाबा</span></span>
        </a>
        <div class="header-actions">
          <button class="language-toggle" id="language-toggle" type="button" aria-label="Switch language">
            <span class="language-option is-current" data-language-label="en">EN</span>
            <span class="language-divider">/</span>
            <span class="language-option" data-language-label="mr">मराठी</span>
          </button>
        </div>
      </header>

      <main>
        <section class="menu-section" id="menu" aria-label="Menu">
          <div class="category-tabs" role="tablist" aria-label="Menu categories"></div>
          <div id="menu-groups"></div>
        </section>

        <section class="closing-banner" aria-label="A note from Jadhav Dhaba">
          <span class="closing-heart" aria-hidden="true">♥</span>
          <p data-i18n="closingLine">From our counter to your cravings.</p>
          <strong data-i18n="closingSignature">Jadhav Dhaba · Veg &amp; Non-Veg</strong>
        </section>
      </main>

      <footer class="site-footer">
        <a class="footer-brand" href="#">Jadhav Dhaba</a>
        <span data-i18n="footerTagline">Veg &amp; Non-Veg</span>
      </footer>
    </div>
  </body>
</html>
